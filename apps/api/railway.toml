# Railway Config as Code — API (NestJS)
# In Railway service Settings → Config-as-code path → /apps/api/railway.toml
# Root Directory must stay at repo root (/).

[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/docker/Dockerfile.api"
watchPatterns = [
  "apps/api/**",
  "packages/**",
  "infra/docker/Dockerfile.api",
  "infra/docker/api-entrypoint.sh",
  "scripts/railway-start.cjs",
  "pnpm-lock.yaml",
  "package.json",
  "apps/api/railway.toml"
]

[deploy]
startCommand = "/app/infra/docker/api-entrypoint.sh"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
