# Railway Config as Code — Web (Next.js admin + public pay portal)
# In Railway service Settings → Config-as-code path → /apps/web/railway.toml
# Root Directory must stay at repo root (/).

[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/docker/Dockerfile.web"
watchPatterns = [
  "apps/web/**",
  "infra/docker/Dockerfile.web",
  "pnpm-lock.yaml",
  "package.json",
  "apps/web/railway.toml"
]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
