# INTENTIONALLY MINIMAL — do not deploy the monorepo as a single service.
#
# Create TWO GitHub services from this repo and set Config-as-code:
#   revenue-backend  →  /apps/api/railway.toml
#   revenue-web      →  /apps/web/railway.toml
#
# Also add: MySQL, Redis, RabbitMQ (see docs/railway.md)
#
# If Railway auto-created one service from the root, delete it or point
# Config-as-code to /apps/api/railway.toml or /apps/web/railway.toml.

[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/docker/Dockerfile.api"

[deploy]
startCommand = "/app/infra/docker/api-entrypoint.sh"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 300
