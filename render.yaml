# Render Blueprint — fullstack Government Revenue Platform
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy: Dashboard → New → Blueprint → connect statisense/revenue-backend → apply.
#
# IMPORTANT: Render does NOT support Railway ${{Service.VAR}} syntax.
# Use fromService links below (or set MYSQL_HOST / MYSQL_PASSWORD manually).

services:
  # ── Redis (optional for app boot; used when present) ───────────────────────
  - type: keyvalue
    name: revenue-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

  # ── MySQL 8 (private + disk — Starter plan required) ───────────────────────
  - type: pserv
    name: revenue-mysql
    runtime: docker
    plan: starter
    dockerfilePath: ./infra/docker/Dockerfile.mysql
    dockerContext: .
    disk:
      name: revenue-mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: revenue
      - key: MYSQL_USER
        value: revenue
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true

  # ── NestJS API ─────────────────────────────────────────────────────────────
  - type: web
    name: revenue-api
    runtime: docker
    plan: free
    dockerfilePath: ./infra/docker/Dockerfile.api
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api/v1
      - key: API_URL
        value: auto
      # Build DATABASE_URL from MYSQL_* (do NOT paste Railway ${{...}} here)
      - key: DATABASE_URL
        value: auto
      - key: TENANT_AGENCY_CODE
        value: NCS
      - key: COOKIE_SECURE
        value: "true"
      - key: DEFAULT_CURRENCY
        value: NGN
      - key: SMS_PROVIDER
        value: console
      - key: WHATSAPP_PROVIDER
        value: console
      - key: SEED_ON_BOOT
        value: "false"

      - key: MYSQL_HOST
        fromService:
          name: revenue-mysql
          type: pserv
          property: host
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_USER
        value: revenue
      - key: MYSQL_DATABASE
        value: revenue
      - key: MYSQL_PASSWORD
        fromService:
          name: revenue-mysql
          type: pserv
          envVarKey: MYSQL_PASSWORD

      - key: REDIS_URL
        fromService:
          name: revenue-redis
          type: keyvalue
          property: connectionString

      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: HMAC_PAYMENT_SECRET
        generateValue: true

      # Must be 64+ hex chars — set in dashboard: openssl rand -hex 32
      - key: FIELD_ENCRYPTION_KEY
        sync: false

      # Point these at the Web service URL after revenue-web is live
      - key: APP_URL
        sync: false
      - key: PAY_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false

  # ── Next.js Web (admin + /pay) ─────────────────────────────────────────────
  - type: web
    name: revenue-web
    runtime: docker
    plan: free
    dockerfilePath: ./infra/docker/Dockerfile.web
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: NEXT_PUBLIC_AUTO_LOGIN
        value: "false"
      # Baked at build time — must include /api/v1, e.g. https://revenue-backend-q2kk.onrender.com/api/v1
      - key: NEXT_PUBLIC_API_URL
        sync: false
